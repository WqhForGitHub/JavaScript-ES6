<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>70. 在线报名系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🎓 在线报名</h1>
  <form id="f">
    <input id="n" placeholder="姓名" required>
    <input id="ph" placeholder="手机号" required>
    <select id="c"><option>前端课程</option><option>后端课程</option><option>全栈课程</option><option>UI 设计</option></select>
    <textarea id="m" placeholder="留言（选填）" rows="2"></textarea>
    <button>立即报名</button>
  </form>
  <h3>已报名名单</h3>
  <ul id="list"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
