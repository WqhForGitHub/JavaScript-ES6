<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>85. Clipboard 剪贴板工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>📋 剪贴板工具</h1>
  <textarea id="txt" placeholder="输入要复制的内容..."></textarea>
  <div class="btns">
    <button id="copy" class="primary">复制到剪贴板</button>
    <button id="paste">从剪贴板粘贴</button>
  </div>
  <div id="res" class="res">点击按钮执行操作</div>
</div>
<script src="script.js"></script>
</body>
</html>
