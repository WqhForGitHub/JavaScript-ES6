<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>41. Tab 标签切换</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
  <h1>🗂️ Tab 标签切换</h1>
  <div class="tabs">
    <button data-t="t1" class="active">HTML</button>
    <button data-t="t2">CSS</button>
    <button data-t="t3">JavaScript</button>
  </div>
  <div class="panels">
    <div id="t1" class="panel active"><h3>HTML</h3><p>超文本标记语言，构建网页结构。</p></div>
    <div id="t2" class="panel"><h3>CSS</h3><p>层叠样式表，控制页面外观。</p></div>
    <div id="t3" class="panel"><h3>JavaScript</h3><p>脚本语言，让网页动起来。</p></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
