<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28. 十六进制转换器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔢 十六进制转换器</h1>
  <label>十进制 <input id="dec" type="number"></label>
  <label>十六进制 <input id="hex" placeholder="如 1A3F"></label>
  <label>字节数组（可选）<textarea id="bytes" rows="2" placeholder="49 20 61 6d"></textarea></label>
  <button id="d2h" class="primary">十进制 → 十六进制</button>
  <button id="h2d">十六进制 → 十进制</button>
  <button id="h2s">十六进制字节 → 字符串</button>
</div>
<script src="script.js"></script>
</body>
</html>
