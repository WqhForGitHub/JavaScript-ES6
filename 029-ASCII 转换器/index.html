<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>29. ASCII 转换器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔤 ASCII 转换器</h1>
  <label>文本 <input id="txt" placeholder="输入字符"></label>
  <label>ASCII 码 <input id="asc" placeholder="用逗号或空格分隔"></label>
  <button id="t2a" class="primary">文本 → ASCII</button>
  <button id="a2t">ASCII → 文本</button>
  <div class="table">
    <h3>ASCII 速查表</h3>
    <div id="tbl" class="tbl"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
