<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>192. 在线数据库管理工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside><h3>数据库</h3><ul id="tables"></ul><button id="addTable">+ 新建表</button><button id="seed">填充示例数据</button></aside>
  <main>
    <div class="bar"><span id="cur"></span><button id="addRow">+ 添加行</button><button id="dropTable" class="danger">删除表</button></div>
    <div id="grid"></div>
    <textarea id="sql" placeholder="输入 SQL：CREATE TABLE / INSERT / SELECT / DROP">SELECT * FROM users</textarea>
    <button id="run">执行 SQL</button>
    <pre id="log"></pre>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
<script src="script.js"></script>
</body>
</html>
