<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>180. 模板引擎实现</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🧩 Mini 模板引擎</h1>
  <p class="info">支持 {{变量}}、&lt;%if%&gt;、&lt;%for%&gt; 编译执行。</p>
  <textarea id="tpl" rows="6"><h1>{{title}}</h1>
<ul>
<% for (let i of list) { %>
  <li>{{i}}</li>
<% } %>
<% if (count > 2) { %><p>共 {{count}} 项</p><% } %>
</ul></textarea>
  <div class="row"><button id="go" class="primary">编译渲染</button></div>
  <div id="out" class="html"></div>
</div>
<script src="script.js"></script>
</body>
</html>
