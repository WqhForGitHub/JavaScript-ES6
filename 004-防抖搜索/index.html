<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>防抖/节流 + 搜索框系统</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 60px 16px;
      }
      .wrapper {
        width: 100%;
        max-width: 600px;
      }
      h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
      }
      .subtitle {
        text-align: center;
        color: #999;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .search-box {
        position: relative;
        margin-bottom: 16px;
      }
      .search-input {
        width: 100%;
        padding: 14px 48px 14px 20px;
        font-size: 16px;
        border: 2px solid #e0e0e0;
        border-radius: 30px;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: #4a90d9;
      }
      .search-icon {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #999;
      }
      .spinner {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border: 3px solid #ddd;
        border-top-color: #4a90d9;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: translateY(-50%) rotate(360deg);
        }
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #999;
      }
      .status-bar .retry-btn {
        color: #e74c3c;
        cursor: pointer;
        background: none;
        border: none;
        font-size: 13px;
        text-decoration: underline;
      }
      .status-bar .error {
        color: #e74c3c;
      }
      .status-bar .success {
        color: #27ae60;
      }

      .results {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .result-item {
        padding: 14px 20px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        transition: background 0.15s;
      }
      .result-item:hover {
        background: #f9f9f9;
      }
      .result-item:last-child {
        border-bottom: none;
      }
      .result-title {
        font-size: 15px;
        color: #1a0dab;
      }
      .result-url {
        font-size: 12px;
        color: #009933;
        margin-top: 2px;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: #ccc;
      }
      .highlight {
        background: #fff3cd;
      }

      .throttle-demo {
        margin-top: 32px;
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .throttle-demo h3 {
        margin-bottom: 12px;
        font-size: 15px;
      }
      .throttle-bar {
        height: 60px;
        background: #f0f0f0;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
      }
      .throttle-track {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        transition: left 0.05s linear;
      }
      .debounce-track {
        background: #e74c3c;
      }
      .throttle-track-track {
        background: #2ecc71;
      }
      .throttle-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #999;
        margin-top: 6px;
      }
      .counter-box {
        display: flex;
        gap: 20px;
        margin-top: 8px;
        font-size: 13px;
      }
      .counter-box span {
        color: #666;
      }
      .counter-box b {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>搜索框系统</h1>
      <p class="subtitle">防抖输入 · AbortController 请求取消 · loading 状态 · 错误重试</p>

      <div class="search-box">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="搜索前端技术文章..."
        />
        <span class="search-icon" id="searchIcon">🔍</span>
      </div>

      <div class="status-bar" id="statusBar">
        <span id="statusText">输入关键词开始搜索</span>
        <button class="retry-btn" id="retryBtn" style="display: none">点击重试</button>
      </div>

      <div class="results" id="results">
        <div class="empty">暂无结果</div>
      </div>

      <div class="throttle-demo">
        <h3>防抖 vs 节流对比（移动鼠标）</h3>
        <div class="throttle-bar" id="throttleBar">
          <div class="throttle-track debounce-track" id="debounceTrack"></div>
          <div class="throttle-track throttle-track-track" id="throttleTrack"></div>
        </div>
        <div class="throttle-labels">
          <span style="color: #e74c3c">红色 = 防抖</span>
          <span style="color: #2ecc71">绿色 = 节流</span>
        </div>
        <div class="counter-box">
          <span>
            防抖触发:
            <b id="debounceCount">0</b>
            次
          </span>
          <span>
            节流触发:
            <b id="throttleCount">0</b>
            次
          </span>
        </div>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="app.js"></script>
  </body>
</html>
