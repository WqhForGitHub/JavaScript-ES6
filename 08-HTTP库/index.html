<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniHTTP - 模拟 HTTP 请求库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    h1 { color: #61dafb; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

    .panel {
      width: 100%;
      max-width: 680px;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 16px; color: #61dafb; margin-bottom: 12px; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn {
      padding: 8px 16px; border: 1px solid #0f3460; background: #1a1a2e;
      color: #e0e0e0; border-radius: 6px; cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    .btn:hover { background: #0f3460; }
    .btn-primary { background: #61dafb; color: #0a0e27; border-color: #61dafb; font-weight: 600; }
    .btn-primary:hover { background: #4cc4e8; }

    .config-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .config-row label { font-size: 13px; color: #aaa; }
    .config-row input, .config-row select {
      padding: 6px 10px; background: #0f1117; color: #fff;
      border: 1px solid #333; border-radius: 4px; font-size: 13px;
    }
    .config-row input { width: 80px; }

    .log {
      background: #000;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      max-height: 320px;
      overflow-y: auto;
    }
    .log-line { padding: 3px 0; border-bottom: 1px solid #111; word-break: break-all; }
    .log-line .ts { color: #555; }
    .log-line.info { color: #61dafb; }
    .log-line.success { color: #2ecc71; }
    .log-line.error { color: #e74c3c; }
    .log-line.warn { color: #f39c12; }

    .concurrency-vis {
      display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .slot {
      width: 60px; height: 24px; border-radius: 4px;
      background: #0f3460; display: flex; align-items: center;
      justify-content: center; font-size: 11px; color: #aaa;
      transition: background 0.2s;
    }
    .slot.active { background: #2ecc71; color: #fff; }
    .slot.queued { background: #f39c12; color: #fff; }
  </style>
</head>
<body>
  <h1>MiniHTTP</h1>
  <p class="subtitle">拦截器 · 重试 · 超时 · 并发控制 (axios mini)</p>

  <div class="panel">
    <h2>拦截器演示</h2>
    <p style="font-size:13px;color:#888;margin-bottom:10px">
      已注册：请求拦截器（自动加 token + 日志）、响应拦截器（日志 + 错误统一处理）
    </p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnGet">GET 请求</button>
      <button class="btn btn-primary" id="btnPost">POST 请求</button>
      <button class="btn" id="btnError">触发错误请求</button>
    </div>
  </div>

  <div class="panel">
    <h2>重试 + 超时</h2>
    <div class="config-row">
      <label>重试次数：</label>
      <input type="number" id="retryCount" value="2" min="0" max="5">
      <label>超时(ms)：</label>
      <input type="number" id="timeoutMs" value="3000" min="500" step="500">
      <label>模拟失败率：</label>
      <input type="number" id="failRate" value="50" min="0" max="100">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnRetry">发起请求（带重试）</button>
    </div>
  </div>

  <div class="panel">
    <h2>并发控制</h2>
    <div class="config-row">
      <label>最大并发：</label>
      <input type="number" id="maxConc" value="3" min="1" max="6">
      <label>总请求数：</label>
      <input type="number" id="totalReq" value="8" min="1" max="20">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnConcurrent">批量并发请求</button>
    </div>
    <div class="concurrency-vis" id="concVis"></div>
  </div>

  <div class="panel" style="flex:1">
    <h2>请求日志</h2>
    <div class="log" id="log"></div>
  </div>

  <script src="http.js"></script>
  <script src="app.js"></script>
</body>
</html>
