<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>97. 文字转语音</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🔊 文字转语音</h1>
  <textarea id="txt" rows="4">你好，欢迎使用文字转语音 Demo。</textarea>
  <label>语速 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
  <label>音调 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></label>
  <label>音色 <select id="voice"></select></label>
  <div class="btns"><button id="say" class="primary">朗读</button><button id="stop">停止</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
