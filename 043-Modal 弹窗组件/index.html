<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>43. Modal 弹窗组件</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <h1>🪟 Modal 弹窗组件</h1>
  <button id="open" class="btn primary">打开弹窗</button>
  <button id="openCustom" class="btn">自定义弹窗</button>
</div>
<div id="modal" class="modal">
  <div class="dialog">
    <h2>温馨提示</h2>
    <p>这是一个 Modal 弹窗组件 Demo，点击遮罩或关闭按钮即可关闭。</p>
    <div class="actions">
      <button class="btn cancel">取消</button>
      <button class="btn primary">确定</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
