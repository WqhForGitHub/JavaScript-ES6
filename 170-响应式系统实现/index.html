<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>170. 响应式系统实现</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>⚡ 响应式系统</h1>
  <p class="info">使用 Proxy 实现 reactive / effect / computed。下方输入会实时反映到所有依赖。</p>
  <label>姓 <input id="first" value="王"></label>
  <label>名 <input id="last" value="小明"></label>
  <div class="out">全名：<b id="full"></b></div>
  <div class="out">双倍全名：<b id="double"></b></div>
  <div class="out">姓长度：<b id="len"></b></div>
  <p class="hint">打开控制台查看 effect 执行日志。</p>
</div>
<script src="script.js"></script>
</body>
</html>
