<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞机大战 - Canvas 游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    h1 { margin-bottom: 4px; color: #61dafb; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }

    .game-wrap {
      position: relative;
      border: 2px solid #1a2a4a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(97, 218, 251, 0.15);
    }
    canvas {
      display: block;
      background: #0d1b3e;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      font-size: 14px;
      pointer-events: none;
    }
    .hud-item {
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 6px;
    }
    .hud-score { color: #61dafb; }
    .hud-level { color: #f39c12; }
    .hud-lives { color: #e74c3c; }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .overlay h2 { font-size: 32px; color: #61dafb; }
    .overlay p { color: #aaa; font-size: 14px; }
    .overlay .final-score { font-size: 48px; color: #f39c12; font-weight: bold; }
    .start-btn {
      padding: 12px 36px;
      font-size: 18px;
      background: #61dafb;
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .start-btn:hover { transform: scale(1.05); }
    .start-btn:active { transform: scale(0.95); }

    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>飞机大战</h1>
  <p class="subtitle">requestAnimationFrame · 碰撞检测 · 关卡系统 · 计分</p>

  <div class="game-wrap">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div class="hud" id="hud">
      <span class="hud-item hud-score">得分: <b id="score">0</b></span>
      <span class="hud-item hud-level">关卡: <b id="level">1</b></span>
      <span class="hud-item hud-lives">生命: <b id="lives">3</b></span>
    </div>
    <div class="overlay" id="overlay">
      <h2>飞机大战</h2>
      <p>消灭敌机，挑战更高关卡！</p>
      <button class="start-btn" id="startBtn">开始游戏</button>
      <p class="controls-hint">← → 或 A D 移动 · 空格发射 · 鼠标移动控制</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
