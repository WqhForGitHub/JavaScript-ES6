<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>54. 图片压缩工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <h1>🗜️ 图片压缩工具</h1>
  <input type="file" id="file" accept="image/*">
  <label>质量 <input type="range" id="q" min="10" max="100" value="60"> <span id="qv">60%</span></label>
  <div class="row">
    <div class="col"><h3>原图</h3><img id="orig"><p id="origSize"></p></div>
    <div class="col"><h3>压缩后</h3><img id="comp"><p id="compSize"></p></div>
  </div>
  <button id="dl">下载压缩图</button>
</div>
<script src="script.js"></script>
</body>
</html>
