<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>106. PDF 阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>📕 PDF 阅读器</h1>
  <input type="file" id="f" accept="application/pdf">
  <div class="pager"><button id="prev">上一页</button><span id="pg">0/0</span><button id="next">下一页</button></div>
  <canvas id="cv"></canvas>
  <p class="note">使用浏览器原生 PDF.js（pdfjsLib 已通过 CDN）渲染。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="script.js"></script>
</body>
</html>
