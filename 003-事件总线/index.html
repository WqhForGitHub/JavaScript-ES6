<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bus - 事件总线</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1117;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 720px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      h1 {
        grid-column: 1 / -1;
        color: #61dafb;
      }
      .panel {
        background: #1a1d29;
        border-radius: 10px;
        padding: 20px;
      }
      .panel h2 {
        font-size: 16px;
        margin-bottom: 14px;
        color: #aaa;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        margin: 4px 0;
        width: 100%;
        display: block;
      }
      .btn-emit {
        background: #61dafb;
        color: #0f1117;
        font-weight: 600;
      }
      .btn-sub {
        background: #2ecc71;
        color: #fff;
      }
      .btn-unsub {
        background: #e74c3c;
        color: #fff;
      }
      .btn-once {
        background: #f39c12;
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .log-panel {
        grid-column: 1 / -1;
        background: #000;
        border-radius: 10px;
        padding: 16px;
        max-height: 260px;
        overflow-y: auto;
        font-family: 'Consolas', monospace;
        font-size: 13px;
      }
      .log-line {
        padding: 2px 0;
        border-bottom: 1px solid #1a1a1a;
      }
      .log-line .time {
        color: #555;
      }
      .log-line .event {
        color: #61dafb;
      }
      .log-line .msg {
        color: #2ecc71;
      }
      input {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #0f1117;
        color: #fff;
        margin-bottom: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Event Bus 事件总线</h1>

      <div class="panel">
        <h2>订阅 / 取消订阅</h2>
        <input type="text" id="eventName" placeholder="事件名，如 user:login" value="user:login" />
        <button class="btn btn-sub" id="subscribeBtn">订阅事件</button>
        <button class="btn btn-once" id="onceBtn">订阅一次 (once)</button>
        <button class="btn btn-unsub" id="unsubscribeBtn">取消订阅</button>
        <button class="btn btn-unsub" id="clearBtn">清空全部</button>
      </div>

      <div class="panel">
        <h2>发布事件</h2>
        <input type="text" id="emitName" placeholder="事件名" value="user:login" />
        <input type="text" id="emitData" placeholder="事件数据" value='{"name":"Alice"}' />
        <button class="btn btn-emit" id="emitBtn">emit 触发</button>
      </div>

      <div class="log-panel" id="logPanel">
        <div class="log-line">
          <span class="time">[--:--:--]</span>
          事件日志（操作上方按钮观察发布订阅）
        </div>
      </div>
    </div>

    <script src="event-bus.js"></script>
    <script src="app.js"></script>
  </body>
</html>
