<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>156. 翻译工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🌍 翻译工具</h1>
  <div class="selects"><select id="from"></select> → <select id="to"></select></div>
  <textarea id="src" rows="4" placeholder="输入要翻译的文本">Hello world</textarea>
  <button id="go" class="primary">翻译</button>
  <textarea id="res" rows="4" placeholder="翻译结果" readonly></textarea>
</div>
<script src="script.js"></script>
</body>
</html>
