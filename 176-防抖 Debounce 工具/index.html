<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>176. 防抖 Debounce 工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🛡️ Debounce 防抖</h1>
  <p class="info">输入框停止输入 500ms 后触发。对比未防抖的每次触发。</p>
  <input id="in" placeholder="快速输入...">
  <div class="cmp"><div>未防抖：<b id="a">0</b></div><div>防抖后：<b id="b">0</b></div></div>
  <button id="reset">reset</button>
</div>
<script src="script.js"></script>
</body>
</html>
