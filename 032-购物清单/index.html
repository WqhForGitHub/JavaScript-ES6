<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32. 购物清单</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🛒 购物清单</h1>
  <div class="add">
    <input id="name" placeholder="商品名">
    <input id="qty" type="number" value="1" min="1" style="width:70px">
    <input id="price" type="number" placeholder="单价" step="0.01">
    <button id="add">+</button>
  </div>
  <table><thead><tr><th>✓</th><th>商品</th><th>数量</th><th>单价</th><th>小计</th><th></th></tr></thead>
  <tbody id="body"></tbody>
  <tfoot><tr><td colspan="4">总计</td><td id="total">0</td><td></td></tr></tfoot>
  </table>
</div>
<script src="script.js"></script>
</body>
</html>
