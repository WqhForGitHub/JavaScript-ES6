<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>69. 调查问卷系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>📋 调查问卷</h1>
  <form id="f">
    <div class="q"><p>1. 你的性别</p><label><input type="radio" name="q1" value="男">男</label><label><input type="radio" name="q1" value="女">女</label></div>
    <div class="q"><p>2. 最喜欢的语言（多选）</p><label><input type="checkbox" name="q2" value="JS">JS</label><label><input type="checkbox" name="q2" value="Python">Python</label><label><input type="checkbox" name="q2" value="Go">Go</label><label><input type="checkbox" name="q2" value="Rust">Rust</label></div>
    <div class="q"><p>3. 满意度</p><select name="q3"><option value="">选择</option><option value="非常满意">非常满意</option><option value="满意">满意</option><option value="一般">一般</option><option value="不满意">不满意</option></select></div>
    <div class="q"><p>4. 建议</p><textarea name="q4" rows="3"></textarea></div>
    <button type="submit">提交</button>
  </form>
  <div id="res"></div>
</div>
<script src="script.js"></script>
</body>
</html>
