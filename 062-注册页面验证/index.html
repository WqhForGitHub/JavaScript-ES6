<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>62. 注册页面验证</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>📝 注册</h1>
  <form id="form" novalidate>
    <div class="field"><label>邮箱</label><input id="em" type="email"><div class="err"></div></div>
    <div class="field"><label>用户名</label><input id="u"><div class="err"></div></div>
    <div class="field"><label>密码</label><input id="p" type="password"><div class="err"></div></div>
    <div class="field"><label>确认密码</label><input id="p2" type="password"><div class="err"></div></div>
    <label class="agree"><input type="checkbox" id="ag"> 我已阅读并同意条款</label>
    <button type="submit">注册</button>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
