<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>92. 指南针 Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🧭 指南针</h1>
  <div class="compass">
    <div class="rose" id="rose">
      <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
      <div class="needle"></div>
    </div>
  </div>
  <div id="deg" class="deg">0°</div>
  <p class="note" id="note">移动设备或允许传感器权限后查看实时方向（桌面端拖动下方滑块）。</p>
  <input type="range" id="slider" min="0" max="359" value="0">
</div>
<script src="script.js"></script>
</body>
</html>
