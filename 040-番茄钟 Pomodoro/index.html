<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>40. 番茄钟 Pomodoro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🍅 番茄钟</h1>
  <div class="modes">
    <button data-m="25" class="active">专注 25</button>
    <button data-m="5">短休 5</button>
    <button data-m="15">长休 15</button>
  </div>
  <div id="time" class="time">25:00</div>
  <div class="ctrl">
    <button id="start" class="primary">开始</button>
    <button id="reset">重置</button>
  </div>
  <div class="stat">今日完成番茄: <span id="count">0</span> 🍅</div>
</div>
<script src="script.js"></script>
</body>
</html>
