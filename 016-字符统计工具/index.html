<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16. 字符统计工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔢 字符统计工具</h1>
  <textarea id="text" placeholder="粘贴或输入文本..."></textarea>
  <div class="stats">
    <div><span id="chars">0</span><label>总字符</label></div>
    <div><span id="noSpace">0</span><label>无空格</label></div>
    <div><span id="lines">0</span><label>行数</label></div>
    <div><span id="paras">0</span><label>段落</label></div>
    <div><span id="bytes">0</span><label>字节(UTF-8)</label></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
