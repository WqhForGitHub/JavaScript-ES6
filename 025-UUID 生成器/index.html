<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25. UUID 生成器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔑 UUID 生成器</h1>
  <label>版本
    <select id="ver"><option value="v4">UUID v4</option><option value="short">短 UUID (12位)</option></select>
  </label>
  <label>数量 <input type="number" id="n" value="5" min="1" max="100"></label>
  <button id="gen" class="primary">生成</button>
  <div id="out" class="out"></div>
  <button id="copyAll">复制全部</button>
</div>
<script src="script.js"></script>
</body>
</html>
