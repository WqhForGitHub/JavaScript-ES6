<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>186. 在线聊天室 WebSocket</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h3>💬 在线聊天室</h3>
  <div class="user"><label>昵称</label><input id="user" placeholder="名字" value="guest" maxlength="12"></div>
  <div id="msgs" class="msgs"></div>
  <div class="bar"><input id="msg" placeholder="输入消息，回车发送"><button id="send" class="primary">发送</button></div>
  <p class="status" id="status">未连接</p>
  <p class="hint">使用 wss://echo.websocket.org 回声服务演示（仅用于回环测试）。</p>
</div>
<script src="script.js"></script>
</body>
</html>
