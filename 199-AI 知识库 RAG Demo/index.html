<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>199. AI 知识库 RAG Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>📚 AI 知识库 RAG</h1>
  <p class="info">检索增强生成（Retrieval-Augmented Generation）原理演示：本地知识库 → 关键词检索 → 拼接上下文回答。</p>
  <h3>知识库</h3>
  <textarea id="kb" rows="5">React 是一个用于构建用户界面的 JavaScript 库。
Vue 是渐进式 JavaScript 框架。
Angular 是一个完整的 MVC 应用框架。
Node.js 是基于 Chrome V8 引擎的 JavaScript 运行时。
TypeScript 给 JS 添加了类型系统。</textarea>
  <h3>问题</h3>
  <input id="q" placeholder="如：什么是 Vue？">
  <button id="ask" class="primary">查询</button>
  <h3>回答</h3>
  <div id="ans" class="ans"></div>
  <div id="ctx" class="ctx"></div>
</div>
<script src="script.js"></script>
</body>
</html>
