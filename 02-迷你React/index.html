<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini React - 极简版 React 实现</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    h1 { margin-bottom: 8px; color: #61dafb; }
    .desc { color: #888; margin-bottom: 24px; font-size: 14px; }
    #root {
      background: #16213e;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .counter-box {
      text-align: center;
      margin-bottom: 24px;
    }
    .counter-value {
      font-size: 64px;
      font-weight: bold;
      color: #61dafb;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-dec { background: #e74c3c; color: #fff; }
    .btn-inc { background: #2ecc71; color: #fff; }
    .todo-section { border-top: 1px solid #0f3460; padding-top: 20px; }
    .todo-section h2 { font-size: 18px; margin-bottom: 12px; }
    .todo-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .todo-input-row input {
      flex: 1; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0;
      font-size: 14px;
    }
    .btn-add {
      padding: 8px 16px; background: #61dafb; border: none;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; background: #0f3460; border-radius: 6px;
      margin-bottom: 8px;
    }
    .todo-item.done span { text-decoration: line-through; opacity: 0.5; }
    .todo-item span { flex: 1; }
    .todo-item button {
      background: #e74c3c; color: #fff; border: none;
      padding: 4px 10px; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Mini React</h1>
  <p class="desc">用原生 JS 实现的极简 React：createElement / render / diff / useState</p>
  <div id="root"></div>

  <script src="mini-react.js"></script>
  <script src="app.js"></script>
</body>
</html>
