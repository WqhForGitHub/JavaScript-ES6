<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100. 键盘快捷键系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>⌨️ 键盘快捷键</h1>
  <div class="shortcuts">
    <div><kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</div>
    <div><kbd>Ctrl</kbd>+<kbd>B</kbd> 加粗</div>
    <div><kbd>Ctrl</kbd>+<kbd>I</kbd> 斜体</div>
    <div><kbd>Ctrl</kbd>+<kbd>K</kbd> 提示信息</div>
    <div><kbd>Alt</kbd>+<kbd>1</kbd> 切换主题</div>
  </div>
  <div id="log" class="log">按下列组合键试试</div>
  <div id="theme" class="theme">当前主题：浅色</div>
</div>
<script src="script.js"></script>
</body>
</html>
