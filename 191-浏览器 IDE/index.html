<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>191. 浏览器 IDE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ide">
  <aside class="side">
    <h3>文件管理</h3>
    <ul id="files"></ul><button id="new">+ 新建</button><button id="del">删除当前</button>
    <h3>已安装扩展</h3>
    <ul><li> prettier</li><li> emmet</li><li> minimap</li></ul>
  </aside>
  <main class="main">
    <div class="bar"><span id="finfo"></span><button id="save">保存</button></div>
    <textarea id="ed" spellcheck="false" class="ed"></textarea>
    <div class="status">行 <b id="ln">1</b> · 列 <b id="col">1</b> · 字符 <b id="n">0</b></div>
  </main>
  <section class="prev">
    <h3>预览</h3>
    <iframe id="out"></iframe>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
