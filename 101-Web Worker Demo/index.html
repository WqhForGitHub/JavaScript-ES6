<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101. Web Worker Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>⚙️ Web Worker Demo</h1>
  <p>计算大数阶乘，主线程保持响应。</p>
  <input id="n" type="number" value="50000" placeholder="n">
  <button id="run" class="primary">后台计算</button>
  <div id="out" class="out">结果将显示于此</div>
  <p class="hint">在计算过程中试试在输入框打字，主线程依然流畅。</p>
</div>
<script id="worker-src" type="javascript/worker">
self.onmessage = e => {
  let sum = 0;
  for (let i = 0; i <= e.data; i++) sum += i;
  self.postMessage(sum);
};
</script>
<script src="script.js"></script>
</body>
</html>
