<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20. 彩票号码生成器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🎰 彩票号码生成器</h1>
  <label>玩法
    <select id="type">
      <option value="ssq">双色球 (6红+1蓝)</option>
      <option value="dlt">大乐透 (5前+2后)</option>
      <option value="3d">福彩3D (3位0-9)</option>
    </select>
  </label>
  <button id="gen" class="primary">生成号码</button>
  <div id="out" class="balls"></div>
  <p class="tip">仅供娱乐，理性购彩</p>
</div>
<script src="script.js"></script>
</body>
</html>
