<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <h1>⏳ Loading 动画库</h1>

    <div class="cell"><div class="dots"><i></i><i></i><i></i></div><span>Dots</span></div>
    <div class="cell"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><span>Bars</span></div>
    <div class="cell"><div class="ring"></div><span>Ring</span></div>
    <div class="cell"><div class="pulse"></div><span>Pulse</span></div>
    <div class="cell"><div class="cube"></div><span>Cube</span></div>
    <div class="cell"><div class="orbit"><i></i></div><span>Orbit</span></div>
    <div class="cell"><div class="ripple"><i></i><i></i></div><span>Ripple</span></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
