<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17. 单词统计工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>📝 单词统计工具</h1>
  <textarea id="text" placeholder="输入文本（中英文均可）..."></textarea>
  <div class="stats">
    <div><span id="words">0</span><label>单词/词数</label></div>
    <div><span id="sent">0</span><label>句子</label></div>
    <div><span id="uniq">0</span><label>不同词</label></div>
    <div><span id="avg">0</span><label>平均长度</label></div>
  </div>
  <h3>词频 Top 10</h3>
  <div id="freq"></div>
</div>
<script src="script.js"></script>
</body>
</html>
