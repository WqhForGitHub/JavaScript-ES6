<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35. 密码管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🔑 密码管理器</h1>
  <p class="warn">⚠️ 本 Demo 仅做前端存储演示，请勿保存真实重要密码。</p>
  <div class="form">
    <input id="site" placeholder="网站 / 名称">
    <input id="user" placeholder="用户名">
    <input id="pass" placeholder="密码">
    <button id="add">保存</button>
  </div>
  <input id="search" placeholder="搜索...">
  <table><thead><tr><th>网站</th><th>用户名</th><th>密码</th><th></th></tr></thead>
  <tbody id="body"></tbody></table>
</div>
<script src="script.js"></script>
</body>
</html>
