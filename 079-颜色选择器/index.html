<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>79. 颜色选择器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🎨 颜色选择器</h1>
  <div class="pick"><input type="color" id="c" value="#6c5ce7"><input type="range" id="r" min="0" max="360" value="256"></div>
  <div class="row"><label>HEX</label><input id="hex"></div>
  <div class="row"><label>RGB</label><input id="rgb"></div>
  <div class="row"><label>HSL</label><input id="hsl"></div>
  <div id="prev" class="prev"></div>
</div>
<script src="script.js"></script>
</body>
</html>
