<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>27. 二进制转换器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>0️⃣1️⃣ 二进制转换器</h1>
  <label>十进制 <input id="dec" type="number"></label>
  <label>二进制 <input id="bin" placeholder="0/1 字符串"></label>
  <button id="d2b" class="primary">十进制 → 二进制</button>
  <button id="b2d">二进制 → 十进制</button>
  <div class="explain">支持任意大小整数（BigInt）</div>
</div>
<script src="script.js"></script>
</body>
</html>
