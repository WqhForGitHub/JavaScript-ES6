<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>78. 时间选择器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>⏰ 时间选择器</h1>
  <div class="picker">
    <div class="col"><button id="h+">▲</button><span id="h">12</span><button id="h-">▼</button></div>
    <div class="sep">:</div>
    <div class="col"><button id="m+">▲</button><span id="m">00</span><button id="m-">▼</button></div>
    <button id="toggle">PM</button>
  </div>
  <div id="res" class="res">12:00 PM</div>
</div>
<script src="script.js"></script>
</body>
</html>
