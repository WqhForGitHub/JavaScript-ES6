<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26. 时间戳转换器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>⏱️ 时间戳转换器</h1>
  <div class="row"><label>时间戳(秒)</label><input id="ts" type="number"></div>
  <div class="row"><label>日期时间</label><input id="dt" type="text" placeholder="YYYY-MM-DD HH:mm:ss"></div>
  <button id="t2d">时间戳 → 日期</button>
  <button id="d2t" class="primary">日期 → 时间戳</button>
  <button id="now">取当前时间</button>
  <div id="out" class="out"></div>
</div>
<script src="script.js"></script>
</body>
</html>
