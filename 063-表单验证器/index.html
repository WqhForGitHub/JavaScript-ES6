<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>63. 表单验证器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🧾 通用表单验证器</h1>
  <form id="f" novalidate>
    <div class="field"><input data-rule="required|min:2|max:20" placeholder="姓名 (2-20 字)"><div class="err"></div></div>
    <div class="field"><input data-rule="required|email" placeholder="邮箱"><div class="err"></div></div>
    <div class="field"><input data-rule="required|phone" placeholder="手机号"><div class="err"></div></div>
    <div class="field"><input data-rule="required|length:6-12" placeholder="密码 (6-12 位)"><div class="err"></div></div>
    <div class="field"><input data-rule="url" placeholder="个人主页 (https://)"><div class="err"></div></div>
    <button>提交</button>
  </form>
  <div id="ok" class="ok"></div>
</div>
<script src="script.js"></script>
</body>
</html>
