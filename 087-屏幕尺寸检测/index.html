<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>87. 屏幕尺寸检测</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>🖥️ 屏幕尺寸检测</h1>
  <div class="grid">
    <div class="big" id="vp">0 × 0</div><div class="lbl">视口尺寸 viewport</div>
    <div class="big" id="sc">0 × 0</div><div class="lbl">屏幕分辨率 screen</div>
    <div class="big" id="ava">0 × 0</div><div class="lbl">可用屏幕 availScreen</div>
    <div class="big" id="dpr">1</div><div class="lbl">设备像素比 DPR</div>
  </div>
  <div class="badge" id="badge">检测中...</div>
  <p class="hint">调整窗口大小或屏幕时数据实时更新</p>
</div>
<script src="script.js"></script>
</body>
</html>
