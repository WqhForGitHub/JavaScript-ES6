<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Pro - 状态驱动版</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Todo Pro</h1>
        <div class="toolbar">
          <button id="undoBtn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
          <button id="redoBtn" title="重做 (Ctrl+Y)">↷ 重做</button>
        </div>
      </header>

      <section class="input-section">
        <input type="text" id="todoInput" placeholder="输入待办事项，回车添加..." />
        <input type="text" id="tagInput" placeholder="标签 (逗号分隔)" />
        <select id="categorySelect">
          <option value="default">默认</option>
          <option value="work">工作</option>
          <option value="life">生活</option>
          <option value="study">学习</option>
        </select>
        <button id="addBtn">添加</button>
      </section>

      <section class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">未完成</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
        <span class="category-filter">
          <label>分类：</label>
          <select id="filterCategory">
            <option value="all">全部分类</option>
            <option value="default">默认</option>
            <option value="work">工作</option>
            <option value="life">生活</option>
            <option value="study">学习</option>
          </select>
        </span>
        <span class="counter" id="counter"></span>
      </section>

      <ul id="todoList" class="todo-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
