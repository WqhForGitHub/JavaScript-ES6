<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23. 硬币正反面模拟器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🪙 硬币正反面</h1>
  <div id="coin" class="coin">正</div>
  <button id="flip" class="primary">抛硬币</button>
  <div class="stat">
    <div><span id="h">0</span><label>正面</label></div>
    <div><span id="t">0</span><label>反面</label></div>
    <div><span id="c">0</span><label>总次数</label></div>
  </div>
  <button id="reset">清空统计</button>
</div>
<script src="script.js"></script>
</body>
</html>
